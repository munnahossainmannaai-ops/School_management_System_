apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sms-ingress
  namespace: school-system
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - sms.example.com
      secretName: sms-tls-secret
  rules:
    - host: sms.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sms-app-service
                port:
                  number: 80
